name: Update weather data

on:
  workflow_dispatch:

  schedule:
    # Every two hours at minute 37.
    # GitHub Actions cron uses UTC.
    - cron: "37 */2 * * *"

permissions:
  contents: write

# Prevent scheduled and manual runs from pushing simultaneously.
# Keep queued runs instead of replacing them.
concurrency:
  group: update-weather-master
  cancel-in-progress: false
  queue: max

jobs:
  update-weather:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Generate weather data
        run: python update_weather.py

      - name: Commit updated weather data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add weather-data.js

          if git diff --cached --quiet; then
            echo "No weather changes to commit."
            exit 0
          fi

          git commit -m "Update weather data"

          for attempt in 1 2 3; do
            git pull --rebase origin master

            if git push origin HEAD:master; then
              exit 0
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "Push failed after 3 attempts."
              exit 1
            fi

            sleep $((attempt * 5))
          done
